name: Build open_jtalk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: r9y9/hts_engine_API
          path: hts_engine_API

      # If you fork r9y9/open_jtalk, replace this with a plain `uses: actions/checkout@v4`
      # and set path: open_jtalk, so the workflow builds your fork instead.
      - uses: actions/checkout@v4
        with:
          repository: r9y9/open_jtalk
          ref: '1.11'
          path: open_jtalk

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build hts_engine_API (static)
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA="-DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
          fi
          cmake -G Ninja -S hts_engine_API/src -B hts_engine_API/src/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF $EXTRA
          cmake --build hts_engine_API/src/build

      - name: Build open_jtalk (static)
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA="-DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
          else
            EXTRA="-DCMAKE_EXE_LINKER_FLAGS=-static"
          fi
          cmake -G Ninja -S open_jtalk/src -B open_jtalk/src/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INCLUDE_PATH="${{ github.workspace }}/hts_engine_API/src/include" \
            -DCMAKE_LIBRARY_PATH="${{ github.workspace }}/hts_engine_API/src/build/lib" \
            $EXTRA
          cmake --build open_jtalk/src/build

      - name: Collect binary
        shell: bash
        run: |
          mkdir -p out
          find open_jtalk/src/build \( -name open_jtalk -o -name open_jtalk.exe \) -type f -exec cp {} out/ \;
          ls -l out
          test -n "$(ls out)"

      - name: Check dependencies
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            dumpbin //dependents out/open_jtalk.exe
          else
            ldd out/open_jtalk || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: open_jtalk-${{ matrix.name }}
          path: out/*
