name: Build open_jtalk

# Expects the two official source tarballs committed in the repo:
#   sources/hts_engine_API-1.10.tar.gz
#   sources/open_jtalk-1.11.tar.gz

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}

    env:
      # Old 2018-era code: keep newer GCC from turning legacy C/C++ into hard errors.
      CFLAGS: -O2 -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-pointer-types
      CXXFLAGS: -O2 -std=gnu++98

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: base-devel mingw-w64-x86_64-toolchain

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build hts_engine_API
        run: |
          BUILD=""
          if [ "${{ runner.os }}" = "Windows" ]; then BUILD="--build=x86_64-w64-mingw32"; fi
          tar xzf sources/hts_engine_API-1.10.tar.gz
          cd hts_engine_API-1.10
          ./configure --prefix="$PWD/../hts-install" $BUILD
          make
          make install

      - name: Build open_jtalk
        run: |
          BUILD=""
          LDF="-static"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BUILD="--build=x86_64-w64-mingw32"
            LDF="-static -static-libgcc -static-libstdc++"
          fi
          tar xzf sources/open_jtalk-1.11.tar.gz
          cd open_jtalk-1.11
          ./configure \
            --with-hts-engine-header-path="$PWD/../hts-install/include" \
            --with-hts-engine-library-path="$PWD/../hts-install/lib" \
            --with-charset=UTF-8 $BUILD
          make LDFLAGS="$LDF"

      - name: Collect binary
        run: |
          mkdir -p out
          cp open_jtalk-1.11/bin/open_jtalk* out/
          ls -l out

      - name: Check dependencies
        run: ldd out/open_jtalk* || true

      - uses: actions/upload-artifact@v4
        with:
          name: open_jtalk-${{ matrix.name }}
          path: out/*